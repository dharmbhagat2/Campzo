<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Secure Payment</title>

<link rel="stylesheet" href="style.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI, sans-serif;
}

body{

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    background:
    linear-gradient(
        135deg,
        #0f172a,
        #1e3a8a,
        #2563eb,
        #0f172a
    );

    background-size:400% 400%;

    animation:bgMove 12s ease infinite;

    overflow:hidden;
}

/* ANIMATED BACKGROUND */

@keyframes bgMove{

    0%{
        background-position:0% 50%;
    }

    50%{
        background-position:100% 50%;
    }

    100%{
        background-position:0% 50%;
    }
}

/* BACKGROUND GLOW */

.bg-circle1,
.bg-circle2{

    position:absolute;

    border-radius:50%;

    filter:blur(100px);

    z-index:0;
}

.bg-circle1{

    width:320px;
    height:320px;

    background:#38bdf8;

    top:-100px;
    left:-100px;

    opacity:0.35;
}

.bg-circle2{

    width:320px;
    height:320px;

    background:#9333ea;

    bottom:-100px;
    right:-100px;

    opacity:0.35;
}

/* PAYMENT CONTAINER */

.payment-container{

    position:relative;

    z-index:2;
}

/* PAYMENT CARD */

.payment-card{

    width:430px;

    padding:42px 35px;

    border-radius:30px;

    background:
    rgba(255,255,255,0.10);

    -webkit-backdrop-filter:blur(18px);
    backdrop-filter:blur(18px);

    border:
    1px solid rgba(255,255,255,0.15);

    box-shadow:
    0 20px 60px rgba(0,0,0,0.35);

    text-align:center;

    animation:
    fadeUp 0.7s ease,
    floatCard 4s ease-in-out infinite;
}

/* ENTRY */

@keyframes fadeUp{

    from{
        opacity:0;
        transform:translateY(40px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* FLOAT */

@keyframes floatCard{

    0%{
        transform:translateY(0px);
    }

    50%{
        transform:translateY(-8px);
    }

    100%{
        transform:translateY(0px);
    }
}

/* ICON */

.payment-icon{

    width:90px;
    height:90px;

    margin:auto;
    margin-bottom:22px;

    border-radius:50%;

    display:flex;
    justify-content:center;
    align-items:center;

    background:
    linear-gradient(
        135deg,
        #22c55e,
        #16a34a
    );

    font-size:40px;

    box-shadow:
    0 10px 35px rgba(34,197,94,0.45);
}

/* TITLE */

.payment-card h1{

    color:white;

    font-size:44px;

    margin-bottom:10px;

    font-weight:700;
}

.subtitle{

    color:#dbeafe;

    margin-bottom:32px;

    font-size:15px;
}

/* INFO BOX */

.info-box{

    background:
    rgba(255,255,255,0.08);

    border:
    1px solid rgba(255,255,255,0.12);

    border-radius:20px;

    padding:24px;

    margin-bottom:30px;

    text-align:left;
}

.info-row{

    display:flex;
    justify-content:space-between;
    align-items:center;

    margin-bottom:18px;
}

.info-row:last-child{
    margin-bottom:0;
}

.label{

    color:#dbeafe;

    font-size:15px;
}

.value{

    color:white;

    font-weight:700;

    font-size:18px;
}

/* BUTTON */

.pay-btn{

    position:relative;

    overflow:hidden;

    width:100%;

    padding:18px;

    border:none;

    border-radius:18px;

    background:
    linear-gradient(
        135deg,
        #22c55e,
        #16a34a
    );

    color:white;

    font-size:22px;
    font-weight:700;

    cursor:pointer;

    transition:0.3s;

    box-shadow:
    0 14px 35px rgba(34,197,94,0.35);
}

/* SHINE EFFECT */

.pay-btn::before{

    content:"";

    position:absolute;

    top:0;
    left:-100%;

    width:100%;
    height:100%;

    background:
    linear-gradient(
        120deg,
        transparent,
        rgba(255,255,255,0.3),
        transparent
    );

    transition:0.7s;
}

.pay-btn:hover::before{
    left:100%;
}

.pay-btn:hover{

    transform:translateY(-3px);

    box-shadow:
    0 18px 45px rgba(34,197,94,0.45);
}

/* SECURE TEXT */

.secure-text{

    margin-top:20px;

    color:#dbeafe;

    font-size:14px;
}

/* MOBILE */

@media(max-width:500px){

    .payment-card{

        width:92%;

        padding:32px 24px;
    }

    .payment-card h1{
        font-size:34px;
    }

    .value{
        font-size:16px;
    }
}

</style>

</head>

<body>

<div class="bg-circle1"></div>
<div class="bg-circle2"></div>

<div class="payment-container">

    <div class="payment-card">

        <div class="payment-icon">
            💳
        </div>

        <h1>Secure Payment</h1>

        <p class="subtitle">
            Complete your event registration securely
        </p>

        <div class="info-box">

            <div class="info-row">

                <span class="label">
                    🎉 Event
                </span>

                <span class="value" id="eventName"></span>

            </div>

            <div class="info-row">

                <span class="label">
                    💰 Amount
                </span>

                <span class="value">
                    ₹ <span id="eventPrice"></span>
                </span>

            </div>

        </div>

        <button class="pay-btn" onclick="payNow()">
            Pay Now 🚀
        </button>

        <p class="secure-text">
            🔒 100% Secure payments powered by Razorpay
        </p>

    </div>

</div>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script src="payment.js"></script>

</body>
</html>
