<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard</title>

<link rel="stylesheet" href="admin.css">

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

<!-- 🔵 SIDEBAR -->
<div class="sidebar">
    <h2>Admin Panel</h2>

    <a href="admin.html">Dashboard</a>
    <a href="manage-events.html">Manage Events</a>
    <a href="registrations.html">Registrations</a>
    <a href="attendance.html">Attendance</a>
    <a href="all-events.html">All Events</a>
    <a href="index.html">Logout</a>
</div>

<!-- 🟢 MAIN CONTENT -->
<div class="main">

    <h1>Dashboard Overview</h1>

    <!-- 📊 STATS CARDS -->
    <div class="cards">

        <div class="card">
            <h3>Total Events</h3>
            <p id="totalEvents">0</p>
        </div>

        <div class="card">
            <h3>Total Registrations</h3>
            <p id="totalRegistrations">0</p>
        </div>
        <div class="card">
    <h3>Total Revenue</h3>
    <p id="totalRevenue">₹0</p>
</div>

    </div>

    <!-- 📊 ANALYTICS -->
   <div class="charts-container">

    <div class="chart-box">
        <h3>📊 Event Analytics (Bar Graph)</h3>
        <div class="chart-wrapper">
            <canvas id="barChart"></canvas>
        </div>
    </div>

    <div class="chart-box">
        <h3>📈 Registrations per Event (Pie Chart)</h3>
        <div class="chart-wrapper">
            <canvas id="pieChart"></canvas>
        </div>
    </div>

</div>
    <!-- 📋 RECENT TABLE -->
    <h2 class="section-title">📋 Recent Registrations</h2>

    <table id="recentTable">
        <thead>
            <tr>
                <th>Student</th>
                <th>Event</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

</div>

<!-- 🔔 TOAST -->
<div id="toast-container"></div>

<!-- 🔧 SCRIPTS (ORDER IMPORTANT) -->
<script src="admin-analytics.js"></script>
<script src="admin.js"></script>
<script src="toast.js"></script>

</body>
</html>
